spring:
  application:
    name: queuepulse-backend

  datasource:
    url: jdbc:mysql://localhost:3306/queuepulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${QUEUEPULSE_KAFKA_GROUP_ID:queuepulse-analytics}
      auto-offset-reset: earliest

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:queuepulse-dev-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000

queuepulse:
  kafka:
    enabled: true
    consumer:
      group-id: queuepulse-analytics
    topic:
      queue-joined: queue.joined
